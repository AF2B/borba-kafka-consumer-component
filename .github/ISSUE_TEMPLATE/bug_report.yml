name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here: report them privately, as described in the security policy.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A short snippet or a repository that shows the problem.
      render: clojure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag or commit of borba-kafka-consumer-component you use.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: The Java version and the Clojure version.
