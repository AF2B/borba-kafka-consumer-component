name: CI

# The quality gate. The steps live in borba-tooling and are the make targets of
# this repository; see docs/standard.md there.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib.yml@c91f13d33e8d6d2deca8c3d0dee2e08458984711 # v0.1.5
    with:
      postgres: false
      redis: false
      kafka: true
