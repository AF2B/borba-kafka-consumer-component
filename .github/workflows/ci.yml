name: CI

# The quality gate. The steps live in borba-tooling and are the make targets of
# this repository; see docs/standard.md there.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib.yml@c63c308b69051b9e1cabc24e87153aaa4e5cd26a # v0.1.4
    with:
      postgres: false
      redis: false
      kafka: true
