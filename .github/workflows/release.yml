name: Release

# Runs when a version tag is pushed: the whole quality gate again, then the
# release itself. See CONTRIBUTING.md for how to cut one.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib.yml@c91f13d33e8d6d2deca8c3d0dee2e08458984711 # v0.1.5
    with:
      postgres: false
      redis: false
      kafka: true

  release:
    name: Release
    needs: verify
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib-release.yml@c91f13d33e8d6d2deca8c3d0dee2e08458984711 # v0.1.5
    permissions:
      contents: write
      id-token: write
      attestations: write
