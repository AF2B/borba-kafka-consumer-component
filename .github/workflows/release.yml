name: Release

# Runs when a version tag is pushed: the whole quality gate again, then the
# release itself. See CONTRIBUTING.md for how to cut one.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib.yml@c63c308b69051b9e1cabc24e87153aaa4e5cd26a # v0.1.4
    with:
      postgres: false
      redis: false
      kafka: true

  release:
    name: Release
    needs: verify
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib-release.yml@c63c308b69051b9e1cabc24e87153aaa4e5cd26a # v0.1.4
    permissions:
      contents: write
      id-token: write
      attestations: write
