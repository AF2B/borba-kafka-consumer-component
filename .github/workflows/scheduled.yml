name: Scheduled

# What changes without a commit: outdated dependencies, newly published
# vulnerabilities and new secret patterns. Findings arrive as a failed run or as
# the "Outdated dependencies" issue.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled:
    name: Scheduled
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib-scheduled.yml@c91f13d33e8d6d2deca8c3d0dee2e08458984711 # v0.1.5
    permissions:
      contents: read
      issues: write
