# ─────────────────────────────────────────────────────────────────────────────
# GitLab CI/CD — library component
#
# Pipeline runs on:
#   • Pushes to the default branch
#   • Merge requests
#   • Tags matching v<major>.<minor>.<patch>  (invalid tags = no pipeline)
#
# Stages:
#   validate  → fmt-check, fmt-fix (advisory), lint   [parallel]
#   test      → test, coverage (≥ 85% or fail)        [parallel]
#   build     → jar                                    [tags only]
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - validate
  - test
  - build

# ── Workflow: when to create a pipeline ──────────────────────────────────────
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/   # valid tag → full pipeline
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Defaults shared by all jobs ───────────────────────────────────────────────
default:
  image: clojure:temurin-21-tools-deps
  cache:
    key:
      files:
        - deps.edn
    paths:
      - .m2/
      - .cpcache/
  before_script:
    # Redirect Maven + tools.deps cache into the project dir so GitLab can cache it
    - export JAVA_TOOL_OPTIONS="-Duser.home=$CI_PROJECT_DIR"
    - mkdir -p .m2 .cpcache

# ── Stage: validate ───────────────────────────────────────────────────────────

fmt-check:
  stage: validate
  script:
    - make fmt-check

fmt-fix:
  # Advisory only — shows what cljfmt would fix, does NOT block the pipeline.
  # Developers should run `make fmt-fix` locally before pushing.
  stage: validate
  allow_failure: true
  script:
    - make fmt-fix
    - git diff --stat

lint:
  stage: validate
  script:
    - make lint

# ── Stage: test ───────────────────────────────────────────────────────────────

test:
  stage: test
  script:
    - make test

coverage:
  stage: test
  script:
    - clojure -M:test -m kaocha.runner
        --plugin kaocha.plugin/cloverage
        --cov-output target/coverage
        --cov-fail-threshold 85
  # Extracts the coverage % from cloverage output for GitLab's coverage badge
  coverage: '/(\d+\.?\d+)% covered/'
  artifacts:
    paths:
      - target/coverage/
    expire_in: 1 week

# ── Stage: build ─────────────────────────────────────────────────────────────

build:
  stage: build
  script:
    - APP_VERSION=$CI_COMMIT_TAG make build
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_TAG"
    paths:
      - target/*.jar
    expire_in: 4 weeks
  # Build only on valid semver tags — branches/MRs skip this job
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
